# Server Configuration
server.port=8080
spring.application.name=api-gateway

# Redis Configuration (Loaded from environment variables)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}

# JWT Secret
jwt.secret=${JWT_SECRET}

# ===================================================================
# Downstream Microservice URLs
# ===================================================================
# Active Service:
user-service.url=${USER_SERVICE_URL:http://localhost:8081}
problem-service.url=${PROBLEM_SERVICE_URL:http://localhost:8082}
submission-service.url=${SUBMISSION_SERVICE_URL:http://localhost:8083}
test-service.url=${TEST_SERVICE_URL: http://localhost:8084}

# [FUTURE SERVICES] - Uncomment when these microservices are created:
# problem-service.url=${PROBLEM_SERVICE_URL:http://localhost:8082}
# submission-service.url=${SUBMISSION_SERVICE_URL:http://localhost:8083}
# execution-service.url=${EXECUTION_SERVICE_URL:http://localhost:8084}


# ===================================================================
# Spring Cloud Gateway Routes
# ===================================================================

# -------------------------------------------------------------------
# 1. USER-SERVICE ROUTES (Active)
# -------------------------------------------------------------------

# 1.1 Public Auth Routes (Bypasses JWT validation & Rate Limiting)
spring.cloud.gateway.server.webflux.routes[0].id=user-service-auth
spring.cloud.gateway.server.webflux.routes[0].uri=${user-service.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/user-service/auth/**

# 1.2 Protected User Profile/Account Routes (Validates JWT)
spring.cloud.gateway.server.webflux.routes[1].id=user-service-protected
spring.cloud.gateway.server.webflux.routes[1].uri=${user-service.url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/user-service/me
spring.cloud.gateway.server.webflux.routes[1].filters[0]=JwtValidationFilter

# -------------------------------------------------------------------
# 2. FUTURE SERVICE ROUTES (Uncomment & enable as you build each service)
# -------------------------------------------------------------------

