# 2.1 Public Problem Routes (Viewing problems - No JWT required)
spring.cloud.gateway.server.webflux.routes[2].id=problem-service-public
spring.cloud.gateway.server.webflux.routes[2].uri=${problem-service.url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/problem-service/problems, /api/v1/problem-service/problem/**
spring.cloud.gateway.server.webflux.routes[2].predicates[1]=Method=GET

# 2.2 Protected Problem Routes (Creating a problem - Requires JWT)
spring.cloud.gateway.server.webflux.routes[3].id=problem-service-protected
spring.cloud.gateway.server.webflux.routes[3].uri=${problem-service.url}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/problem-service/create-problem
spring.cloud.gateway.server.webflux.routes[3].predicates[1]=Method=POST
spring.cloud.gateway.server.webflux.routes[3].filters[0]=JwtValidationFilter


# Define the URL for the submission-service


# 3.1 Submission Service Execution Routes (Run & Submit) -> Requires JWT AND Rate Limiting
spring.cloud.gateway.server.webflux.routes[4].id=submission-service-execution
spring.cloud.gateway.server.webflux.routes[4].uri=${submission-service.url}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/submission-service/submit, /api/v1/submission-service/run
spring.cloud.gateway.server.webflux.routes[4].predicates[1]=Method=POST
spring.cloud.gateway.server.webflux.routes[4].filters[0]=JwtValidationFilter
spring.cloud.gateway.server.webflux.routes[4].filters[1]=RateLimitingFilter

# 3.2 Submission Service History Route (Viewing Submissions) -> Requires JWT ONLY
spring.cloud.gateway.server.webflux.routes[5].id=submission-service-history
spring.cloud.gateway.server.webflux.routes[5].uri=${submission-service.url}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/submission-service/user, /api/v1/submission-service/user/problem/*
spring.cloud.gateway.server.webflux.routes[5].predicates[1]=Method=GET
spring.cloud.gateway.server.webflux.routes[5].filters[0]=JwtValidationFilter

# 4.1 Test Service Actions (Create, Start, Submit) -> Requires JWT ONLY
spring.cloud.gateway.server.webflux.routes[6].id=test-service-actions
spring.cloud.gateway.server.webflux.routes[6].uri=${test-service.url}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/test-service/tests, /api/v1/test-service/tests/*/start, /api/v1/test-service/tests/*/submit
spring.cloud.gateway.server.webflux.routes[6].predicates[1]=Method=POST
spring.cloud.gateway.server.webflux.routes[6].filters[0]=JwtValidationFilter

# 4.2 Test Service Queries (Viewing Dashboards & Test Details) -> Requires JWT ONLY
spring.cloud.gateway.server.webflux.routes[7].id=test-service-queries
spring.cloud.gateway.server.webflux.routes[7].uri=${test-service.url}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/v1/test-service/tests/created, /api/v1/test-service/tests/assigned, /api/v1/test-service/tests/*
spring.cloud.gateway.server.webflux.routes[7].predicates[1]=Method=GET
spring.cloud.gateway.server.webflux.routes[7].filters[0]=JwtValidationFilter