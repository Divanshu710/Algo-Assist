# spring.cloud.gateway.server.webflux.routes.id=submission-service-submit
# spring.cloud.gateway.server.webflux.routes.uri=${submission-service.url}
# spring.cloud.gateway.server.webflux.routes.predicates[0]=Path=/api/v1/submission-service/submissions/**
